<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OK PLAY Online</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- PeerJS for P2P Online -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Zen+Maru+Gothic:wght@700;900&display=swap');
        
        body {
            font-family: 'Zen Maru Gothic', 'Fredoka', sans-serif;
            background: radial-gradient(circle at top left, #fde047 0%, #f97316 40%, #ec4899 100%);
            color: #1e293b;
            user-select: none;
            touch-action: manipulation;
            min-height: 100vh;
        }

        .pop-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border: 4px solid #1e293b;
            box-shadow: 6px 6px 0px #1e293b;
            border-radius: 24px;
        }

        .pop-btn {
            border: 3px solid #1e293b;
            box-shadow: 4px 4px 0px #1e293b;
            transition: all 0.1s ease;
        }
        .pop-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #1e293b;
        }

        /* 盤面セル・タイルスタイル */
        .board-cell {
            width: 52px;
            height: 52px;
            min-width: 52px;
            min-height: 52px;
        }
        @media (min-width: 640px) {
            .board-cell {
                width: 60px;
                height: 60px;
                min-width: 60px;
                min-height: 60px;
            }
        }

        .board-tile {
            width: 100%;
            height: 100%;
            border-radius: 14px;
            border: 3px solid #1e293b;
            box-shadow: 3px 3px 0px #1e293b, inset 0 3px 0px rgba(255, 255, 255, 0.5);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            cursor: pointer;
        }
        .board-tile:hover {
            transform: scale(1.05);
        }
        .board-tile.selected {
            transform: scale(1.15) rotate(-3deg);
            box-shadow: 0 0 0 4px #f59e0b, 5px 5px 0px #1e293b;
            z-index: 30;
        }

        .valid-place {
            background: rgba(255, 255, 255, 0.6);
            border: 3px dashed #1e293b;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .valid-place:hover {
            background: #fde047;
            transform: scale(1.05);
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col justify-between overflow-x-hidden">

    <!-- Header / Navbar -->
    <header class="w-full p-4 pop-card !rounded-none !border-t-0 !border-x-0 sticky top-0 z-40 flex justify-between items-center bg-white/95">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="location.reload()">
            <div class="w-12 h-12 rounded-2xl bg-amber-400 border-3 border-slate-800 flex items-center justify-center shadow-[3px_3px_0px_#1e293b]">
                <span class="text-3xl">🧩</span>
            </div>
            <div>
                <h1 class="font-black text-2xl md:text-3xl tracking-wider text-amber-500 drop-shadow-[2px_2px_0px_#1e293b]" style="-webkit-text-stroke: 1px #1e293b;">
                    OK PLAY!
                </h1>
            </div>
        </div>

        <div id="headerInfo" class="hidden flex items-center space-x-3">
            <div id="roomBadge" class="bg-amber-100 border-2 border-slate-800 px-4 py-1.5 rounded-full text-xs md:text-sm font-black text-slate-800 flex items-center gap-2 cursor-pointer pop-btn" onclick="copyRoomCode()">
                <i class="fa-regular fa-copy"></i>
                <span id="displayRoomCode">----</span>
            </div>
            <button id="soundToggleBtn" onclick="toggleSound()" class="w-10 h-10 rounded-full bg-white border-2 border-slate-800 flex items-center justify-center text-slate-800 text-lg pop-btn">
                <i class="fa-solid fa-volume-high" id="soundIcon"></i>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-6 max-w-5xl flex-grow flex flex-col justify-center">

        <!-- VIEW 1: LOBBY ENTRY -->
        <div id="viewLobby" class="space-y-6 max-w-xl mx-auto w-full">
            <div class="text-center space-y-3 my-2">
                <div class="inline-block px-5 py-2 bg-yellow-300 text-slate-900 rounded-full text-sm font-black border-3 border-slate-800 shadow-[4px_4px_0px_#1e293b]">
                    タイルを並べて5連を作ろう！ 🟩🟦🟥🟨
                </div>
                <h2 class="text-4xl md:text-6xl font-black text-white drop-shadow-[4px_4px_0px_#1e293b]">OK PLAY Online</h2>
            </div>

            <div class="pop-card p-6 space-y-4">
                <div>
                    <label class="block text-xs font-black uppercase tracking-wider text-slate-600 mb-1">プレイヤー名</label>
                    <input type="text" id="playerNameInput" maxlength="10" placeholder="なまえを入力" 
                        class="w-full bg-slate-100 border-3 border-slate-800 rounded-2xl px-5 py-3 text-slate-800 font-black text-lg focus:outline-none focus:bg-white transition">
                </div>

                <div>
                    <label class="block text-xs font-black uppercase tracking-wider text-slate-600 mb-1">あいことば（部屋コード）</label>
                    <input type="text" id="joinRoomCodeInput" placeholder="例: play123" 
                        class="w-full bg-slate-100 border-3 border-slate-800 rounded-2xl px-5 py-3 text-slate-800 font-black tracking-widest text-lg focus:outline-none focus:bg-white transition">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <button id="btnCreateRoom" class="pop-btn w-full bg-emerald-400 hover:bg-emerald-300 text-slate-900 font-black text-xl py-4 rounded-2xl flex items-center justify-center gap-2">
                    <i class="fa-solid fa-plus-circle"></i> 部屋をつくる
                </button>
                <button id="btnJoinRoom" class="pop-btn w-full bg-sky-400 hover:bg-sky-300 text-slate-900 font-black text-xl py-4 rounded-2xl flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-to-bracket"></i> 部屋にはいる
                </button>
            </div>
        </div>

        <!-- VIEW 2: ROOM LOBBY -->
        <div id="viewRoomLobby" class="hidden space-y-5 max-w-xl mx-auto w-full">
            <div class="pop-card p-6 md:p-8 space-y-6">
                <div class="flex justify-between items-center border-b-3 border-slate-800 pb-4">
                    <div>
                        <span class="text-xs font-black text-slate-500 uppercase tracking-wider">ROOM LOBBY</span>
                        <h2 class="text-2xl md:text-3xl font-black text-slate-800 flex items-center gap-2">
                            あいことば: <span id="lobbyRoomCode" class="text-amber-500 font-mono">----</span>
                        </h2>
                    </div>
                    <button onclick="copyRoomCode()" class="pop-btn bg-amber-200 hover:bg-amber-300 text-slate-800 text-xs font-black px-4 py-2 rounded-xl flex items-center gap-2">
                        <i class="fa-regular fa-copy"></i> コピー
                    </button>
                </div>

                <!-- Color Selector -->
                <div class="bg-amber-50 rounded-2xl p-4 border-2 border-slate-800 space-y-2">
                    <div class="flex justify-between items-center">
                        <label class="block text-xs font-black text-slate-700 uppercase">マイカラーをえらぶ</label>
                    </div>
                    <div id="lobbyColorPalette" class="flex flex-wrap gap-3 pt-1"></div>
                </div>

                <!-- Player List -->
                <div class="space-y-3">
                    <div class="flex justify-between items-center text-xs font-black text-slate-700">
                        <span>さんかプレイヤー (<span id="playerCount">0</span>/4名)</span>
                    </div>
                    <div id="playerList" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
                </div>

                <div class="pt-2">
                    <button id="startGameBtn" onclick="startGame()" class="hidden pop-btn w-full bg-yellow-400 hover:bg-yellow-300 text-slate-900 font-black text-2xl py-4 rounded-2xl shadow-lg">
                        ゲームスタート！ 🚀
                    </button>
                    <p id="waitingForHostMsg" class="text-center text-slate-600 text-xs font-black animate-pulse">
                        ホストがゲームを開始するのをまっています...
                    </p>
                </div>
            </div>
        </div>

        <!-- VIEW 3: GAME PLAYING -->
        <div id="viewGame" class="hidden space-y-4 w-full max-w-4xl mx-auto relative">
            
            <!-- Turn & Status Bar -->
            <div class="pop-card p-4 space-y-3">
                <div class="flex flex-wrap justify-between items-center gap-3">
                    <div id="turnBadge" class="pop-btn px-5 py-2 rounded-2xl text-base font-black flex items-center gap-2 bg-white">
                        <span>現在の手番: --</span>
                    </div>
                    <div id="gameInstructionText" class="text-xs md:text-sm font-black text-slate-800 bg-amber-100 px-4 py-2 rounded-xl border-2 border-slate-800"></div>
                </div>

                <!-- Active Players Bar -->
                <div id="headerScoreList" class="grid grid-cols-2 sm:grid-cols-4 gap-2 border-t-2 border-slate-800 pt-3"></div>
            </div>

            <!-- Board Area -->
            <div class="pop-card p-4 sm:p-6 flex justify-center items-center overflow-auto min-h-[460px] max-h-[65vh] bg-amber-50/60">
                <div id="boardGrid" class="grid gap-2 p-4 m-auto transition-all"></div>
            </div>

            <!-- Result Overlay Controls -->
            <div id="gameResultControls" class="hidden pop-card p-6 text-center space-y-4 max-w-md mx-auto bg-yellow-300">
                <h3 id="winnerText" class="text-3xl font-black text-slate-900">勝利！</h3>
                <button id="nextRoundBtn" onclick="restartGame()" class="hidden pop-btn w-full bg-emerald-400 hover:bg-emerald-300 text-slate-900 font-black text-xl py-3.5 rounded-2xl">
                    もういちど遊ぶ 🔄
                </button>
                <p id="clientWaitRestartMsg" class="hidden text-xs text-slate-700 font-black animate-pulse">
                    ホストがつぎの対戦をじゅんび中...
                </p>
            </div>

        </div>

    </main>

    <!-- NOTIFICATION MODAL -->
    <div id="actionNoticeModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm pointer-events-none">
        <div class="pop-card max-w-sm w-full p-6 text-center space-y-2 bg-white">
            <div id="noticeIcon" class="text-4xl">📢</div>
            <h3 id="noticeTitle" class="text-xl font-black text-slate-800">通知</h3>
            <p id="noticeBody" class="text-xs font-bold text-slate-600">内容</p>
        </div>
    </div>

    <footer class="p-4 text-center text-xs font-black text-white/80">
        &copy; OK PLAY Online
    </footer>

    <!-- GAME ENGINE & PEERJS SCRIPT -->
    <script>
        const PREFIX = "ok-play-online-v6-";

        const PLAYER_COLORS = [
            '#ef4444', '#3b82f6', '#10b981', '#f59e0b',
            '#a855f7', '#f97316', '#06b6d4', '#ec4899',
            '#84cc16', '#6366f1', '#f43f5e', '#14b8a6'
        ];

        let peer = null, myId = "", myName = "", roomCode = "";
        let isHost = false;
        let connections = {};
        let hostConn = null;

        let roomData = {
            hostId: "",
            status: 'LOBBY',
            players: {},
            playerOrder: [],
            currentTurnIndex: 0,
            board: {},
            selectedTile: null,
            winnerId: null
        };

        let soundEnabled = true;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) audioCtx = new AudioCtx();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'tap') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(480, now);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'place') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(320, now);
                    osc.frequency.exponentialRampToValueAtTime(640, now + 0.08);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'win') {
                    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.connect(g);
                        g.connect(audioCtx.destination);
                        o.type = 'sine';
                        o.frequency.setValueAtTime(freq, now + i * 0.09);
                        g.gain.setValueAtTime(0.12, now + i * 0.09);
                        g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.09 + 0.25);
                        o.start(now + i * 0.09);
                        o.stop(now + i * 0.09 + 0.25);
                    });
                }
            } catch (e) {
                console.warn(e);
            }
        }

        function showView(viewId) {
            ['viewLobby', 'viewRoomLobby', 'viewGame'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.add('hidden');
            });
            const target = document.getElementById(viewId);
            if (target) target.classList.remove('hidden');

            const headerInfo = document.getElementById('headerInfo');
            if (headerInfo) {
                if (viewId !== 'viewLobby') headerInfo.classList.remove('hidden');
                else headerInfo.classList.add('hidden');
            }
        }

        function getPlayerName() {
            const input = document.getElementById('playerNameInput');
            const val = input ? input.value.trim() : '';
            return val || 'プレイヤー' + Math.floor(Math.random() * 900 + 100);
        }

        function showNotice(icon, title, body, duration = 2000) {
            document.getElementById('noticeIcon').innerText = icon;
            document.getElementById('noticeTitle').innerText = title;
            document.getElementById('noticeBody').innerText = body;
            const modal = document.getElementById('actionNoticeModal');
            if (modal) {
                modal.classList.remove('hidden');
                setTimeout(() => { modal.classList.add('hidden'); }, duration);
            }
        }

        function handleCreateRoom() {
            playSound('tap');
            myName = getPlayerName();
            const input = document.getElementById('joinRoomCodeInput');
            roomCode = input ? input.value.trim().toLowerCase() : '';

            if (!roomCode) {
                alert("あいことばを入力してください");
                return;
            }

            isHost = true;
            const peerId = `${PREFIX}${roomCode}-host`;
            peer = new Peer(peerId);

            peer.on('open', (id) => {
                myId = id;
                roomData.hostId = myId;
                roomData.players = {
                    [myId]: { id: myId, name: myName, color: PLAYER_COLORS[0], remainingTiles: 15, isHost: true }
                };

                setupLobbyUI();
                renderRoomState();
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    alert("そのあいことばは既に使用されています。別の言葉にしてください。");
                } else {
                    alert("接続エラーが発生しました: " + err.type);
                }
            });

            peer.on('connection', (conn) => {
                conn.on('open', () => {
                    conn.on('data', (data) => handleHostData(conn, data));
                });
                conn.on('close', () => {
                    delete connections[conn.peer];
                    delete roomData.players[conn.peer];
                    broadcastState();
                });
            });
        }

        function handleJoinRoom() {
            playSound('tap');
            myName = getPlayerName();
            const input = document.getElementById('joinRoomCodeInput');
            roomCode = input ? input.value.trim().toLowerCase() : '';

            if (!roomCode) {
                alert("あいことばを入力してください");
                return;
            }

            isHost = false;
            const hostPeerId = `${PREFIX}${roomCode}-host`;
            peer = new Peer();

            peer.on('open', (id) => {
                myId = id;
                hostConn = peer.connect(hostPeerId);

                hostConn.on('open', () => {
                    hostConn.send({ type: 'JOIN', id: myId, name: myName });
                    setupLobbyUI();
                });

                hostConn.on('data', (data) => handleClientData(data));
            });

            peer.on('error', () => {
                alert("部屋が見つかりませんでした。あいことばを確認してください。");
            });
        }

        function setupLobbyUI() {
            document.getElementById('displayRoomCode').innerText = roomCode;
            document.getElementById('lobbyRoomCode').innerText = roomCode;
            showView('viewRoomLobby');
        }

        function getFirstAvailableColor() {
            const usedColors = Object.values(roomData.players).map(p => p.color);
            return PLAYER_COLORS.find(c => !usedColors.includes(c)) || PLAYER_COLORS[0];
        }

        function broadcastState() {
            if (!isHost) return;
            Object.values(connections).forEach(c => c.send({ type: 'SYNC_STATE', roomData }));
            renderRoomState();
        }

        function handleHostData(conn, data) {
            if (data.type === 'JOIN') {
                if (roomData.status !== 'LOBBY') {
                    conn.send({ type: 'ERROR', message: 'ゲームはすでに進行中です' });
                    return;
                }
                if (Object.keys(roomData.players).length >= 4) {
                    conn.send({ type: 'ERROR', message: '部屋が満員です（最大4名）' });
                    return;
                }
                connections[conn.peer] = conn;
                const assignedColor = getFirstAvailableColor();
                roomData.players[data.id] = { id: data.id, name: data.name, color: assignedColor, remainingTiles: 15, isHost: false };
                broadcastState();
            } else if (data.type === 'SELECT_COLOR') {
                processSelectColor(data.playerId, data.color);
            } else if (data.type === 'PLACE_TILE') {
                processPlaceTile(data.playerId, data.x, data.y, data.fromX, data.fromY);
            } else if (data.type === 'RESTART_GAME') {
                processStartGame();
            }
        }

        function handleClientData(data) {
            if (data.type === 'SYNC_STATE') {
                roomData = data.roomData;
                renderRoomState();
            } else if (data.type === 'ERROR') {
                alert(data.message);
            }
        }

        window.selectMyColor = function(hexColor) {
            playSound('tap');
            if (isHost) {
                processSelectColor(myId, hexColor);
            } else {
                hostConn.send({ type: 'SELECT_COLOR', playerId: myId, color: hexColor });
            }
        };

        function processSelectColor(playerId, hexColor) {
            const takenBy = Object.values(roomData.players).find(p => p.color === hexColor && p.id !== playerId);
            if (takenBy) return;

            if (roomData.players[playerId]) {
                roomData.players[playerId].color = hexColor;
                broadcastState();
            }
        }

        window.startGame = function() {
            playSound('tap');
            if (!isHost) return;

            const playerIds = Object.keys(roomData.players);
            if (playerIds.length < 2) {
                alert("対戦には2名以上のプレイヤーが必要です");
                return;
            }

            processStartGame();
        };

        function processStartGame() {
            const playerIds = Object.keys(roomData.players);
            roomData.playerOrder = [...playerIds];
            roomData.currentTurnIndex = 0;
            roomData.board = {};
            roomData.selectedTile = null;
            roomData.winnerId = null;
            roomData.status = 'PLAYING';

            Object.keys(roomData.players).forEach(id => {
                roomData.players[id].remainingTiles = 15;
            });

            broadcastState();
        }

        window.restartGame = function() {
            playSound('tap');
            if (isHost) {
                processStartGame();
            } else {
                hostConn.send({ type: 'RESTART_GAME' });
            }
        };

        const ADJACENT_OFFSETS = [
            {x:0, y:-1}, {x:0, y:1}, {x:-1, y:0}, {x:1, y:0}
        ];

        const WIN_DIRECTIONS = [
            {x: 1, y: 0},
            {x: 0, y: 1},
            {x: 1, y: 1},
            {x: 1, y: -1}
        ];

        function isConnectedGraph(tempBoard) {
            const keys = Object.keys(tempBoard);
            if (keys.length <= 1) return true;

            const visited = new Set();
            const queue = [keys[0]];
            visited.add(keys[0]);

            while (queue.length > 0) {
                const current = queue.shift();
                const [cx, cy] = current.split(',').map(Number);

                ADJACENT_OFFSETS.forEach(off => {
                    const nx = cx + off.x;
                    const ny = cy + off.y;
                    const nKey = `${nx},${ny}`;
                    if (tempBoard[nKey] && !visited.has(nKey)) {
                        visited.add(nKey);
                        queue.push(nKey);
                    }
                });
            }

            return visited.size === keys.length;
        }

        function checkWinner(board, x, y, ownerId) {
            for (let dir of WIN_DIRECTIONS) {
                let count = 1;

                let step = 1;
                while (board[`${x + dir.x * step},${y + dir.y * step}`]?.ownerId === ownerId) {
                    count++;
                    step++;
                }

                step = 1;
                while (board[`${x - dir.x * step},${y - dir.y * step}`]?.ownerId === ownerId) {
                    count++;
                    step++;
                }

                if (count >= 5) return true;
            }
            return false;
        }

        function getValidPlacementSpots(board, selectedKey = null) {
            const tempBoard = { ...board };
            if (selectedKey) delete tempBoard[selectedKey];

            const keys = Object.keys(tempBoard);
            if (keys.length === 0) return ["0,0"];

            const validSpots = new Set();
            keys.forEach(k => {
                const [x, y] = k.split(',').map(Number);
                ADJACENT_OFFSETS.forEach(off => {
                    const nx = x + off.x;
                    const ny = y + off.y;
                    const nKey = `${nx},${ny}`;
                    if (!tempBoard[nKey]) {
                        validSpots.add(nKey);
                    }
                });
            });

            return Array.from(validSpots);
        }

        function handleCellClick(x, y) {
            if (roomData.status !== 'PLAYING') return;

            const currentTurnPlayerId = roomData.playerOrder[roomData.currentTurnIndex];
            if (currentTurnPlayerId !== myId) return;

            const p = roomData.players[myId];
            const targetKey = `${x},${y}`;

            // 手持ち0枚：移動フェイズ
            if (p.remainingTiles <= 0) {
                if (roomData.selectedTile) {
                    // すでに移動させる自分のタイルを選択している状態
                    if (targetKey === roomData.selectedTile) {
                        // 同じタイルをもう一度押したら選択解除
                        roomData.selectedTile = null;
                        renderRoomState();
                        return;
                    }

                    const validSpots = getValidPlacementSpots(roomData.board, roomData.selectedTile);
                    if (validSpots.includes(targetKey)) {
                        const [fx, fy] = roomData.selectedTile.split(',').map(Number);
                        sendPlaceTile(x, y, fx, fy);
                        roomData.selectedTile = null;
                    } else {
                        showNotice("⚠️", "配置できません", "既存タイルの隣を選んでください。");
                    }
                } else {
                    // まだ移動させるタイルを選んでいない状態
                    if (roomData.board[targetKey]?.ownerId === myId) {
                        const tempBoard = { ...roomData.board };
                        delete tempBoard[targetKey];

                        if (!isConnectedGraph(tempBoard)) {
                            showNotice("🚫", "移動できません", "このタイルを動かすと盤面が分裂してしまいます！");
                            return;
                        }

                        playSound('tap');
                        roomData.selectedTile = targetKey;
                        renderRoomState();
                    } else {
                        showNotice("💡", "自分のタイルを選択", "手持ちが0枚のため、まず盤上の自分のタイルをタップしてください。");
                    }
                }
            } else {
                // 手持ちあり：配置フェイズ
                const validSpots = getValidPlacementSpots(roomData.board);
                if (validSpots.includes(targetKey)) {
                    sendPlaceTile(x, y, null, null);
                }
            }
        }

        function sendPlaceTile(x, y, fromX, fromY) {
            playSound('place');
            if (isHost) {
                processPlaceTile(myId, x, y, fromX, fromY);
            } else {
                hostConn.send({ type: 'PLACE_TILE', playerId: myId, x, y, fromX, fromY });
            }
        }

        function processPlaceTile(playerId, x, y, fromX, fromY) {
            const p = roomData.players[playerId];
            if (!p) return;

            const isMove = (fromX !== null && fromX !== undefined && fromY !== null && fromY !== undefined);

            if (isMove) {
                delete roomData.board[`${fromX},${fromY}`];
            } else {
                p.remainingTiles = Math.max(0, p.remainingTiles - 1);
            }

            roomData.board[`${x},${y}`] = { ownerId: playerId, color: p.color };

            if (checkWinner(roomData.board, x, y, playerId)) {
                roomData.status = 'FINISHED';
                roomData.winnerId = playerId;
                playSound('win');
            } else {
                roomData.currentTurnIndex = (roomData.currentTurnIndex + 1) % roomData.playerOrder.length;
            }

            broadcastState();
        }

        function renderRoomState() {
            if (!roomData) return;

            const isHostUser = roomData.hostId === myId;

            const scoreListEl = document.getElementById('headerScoreList');
            if (scoreListEl) {
                scoreListEl.innerHTML = '';
                roomData.playerOrder.forEach(pId => {
                    const p = roomData.players[pId];
                    if (!p) return;
                    const isTurn = roomData.status === 'PLAYING' && roomData.playerOrder[roomData.currentTurnIndex] === pId;

                    const percent = Math.round((p.remainingTiles / 15) * 100);

                    const tag = document.createElement('div');
                    tag.className = `p-2.5 rounded-2xl border-2 border-slate-800 flex flex-col justify-between transition-all duration-300 ${isTurn ? 'bg-amber-300 scale-105 shadow-[3px_3px_0px_#1e293b]' : 'bg-white opacity-80'}`;
                    tag.innerHTML = `
                        <div class="flex items-center justify-between gap-1.5 mb-1.5">
                            <div class="flex items-center space-x-2 min-w-0">
                                <span class="w-4 h-4 rounded-full flex-shrink-0 border border-slate-800 shadow-sm" style="background-color:${p.color}"></span>
                                <span class="text-xs font-black text-slate-900 truncate">${escapeHtml(p.name)}</span>
                            </div>
                            ${isTurn ? '<span class="text-[10px] font-black bg-slate-900 text-white px-2 py-0.5 rounded-full flex-shrink-0">手番</span>' : ''}
                        </div>
                        <div class="space-y-1">
                            <div class="flex justify-between items-center text-[11px] font-black text-slate-700">
                                <span>手持ち</span>
                                <span class="font-extrabold text-xs">${p.remainingTiles} / 15枚</span>
                            </div>
                            <div class="w-full bg-slate-200 rounded-full h-2 overflow-hidden border border-slate-800">
                                <div class="h-full transition-all duration-300" style="width: ${percent}%; background-color: ${p.color};"></div>
                            </div>
                        </div>
                    `;
                    scoreListEl.appendChild(tag);
                });
            }

            if (roomData.status === 'LOBBY') {
                showView('viewRoomLobby');

                const startBtn = document.getElementById('startGameBtn');
                const waitingMsg = document.getElementById('waitingForHostMsg');

                if (isHostUser) {
                    if (startBtn) startBtn.classList.remove('hidden');
                    if (waitingMsg) waitingMsg.classList.add('hidden');
                } else {
                    if (startBtn) startBtn.classList.add('hidden');
                    if (waitingMsg) waitingMsg.classList.remove('hidden');
                }

                const playerList = document.getElementById('playerList');
                if (playerList) {
                    playerList.innerHTML = '';
                    const playersArray = Object.values(roomData.players);
                    document.getElementById('playerCount').innerText = playersArray.length;

                    playersArray.forEach(p => {
                        const div = document.createElement('div');
                        div.className = "flex items-center justify-between bg-white border-2 border-slate-800 p-3 rounded-2xl shadow-[2px_2px_0px_#1e293b]";
                        div.innerHTML = `
                            <div class="flex items-center space-x-2.5">
                                <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-black text-white border-2 border-slate-800 shadow" style="background-color:${p.color}">
                                    ${escapeHtml(p.name.charAt(0))}
                                </div>
                                <span class="font-black text-sm text-slate-800">${escapeHtml(p.name)}</span>
                            </div>
                            ${p.isHost ? '<span class="text-[10px] font-black bg-yellow-300 text-slate-900 px-2.5 py-1 rounded-full border-2 border-slate-800">ホスト</span>' : ''}
                        `;
                        playerList.appendChild(div);
                    });
                }

                const colorPaletteEl = document.getElementById('lobbyColorPalette');
                if (colorPaletteEl) {
                    colorPaletteEl.innerHTML = '';
                    const myCurrentColor = roomData.players[myId] ? roomData.players[myId].color : '';
                    const usedColors = Object.values(roomData.players).map(p => p.color);

                    PLAYER_COLORS.forEach(hex => {
                        const isMyColor = hex === myCurrentColor;
                        const isTaken = usedColors.includes(hex) && !isMyColor;

                        const btn = document.createElement('button');
                        btn.type = 'button';
                        btn.onclick = () => { if (!isTaken) selectMyColor(hex); };
                        btn.disabled = isTaken;
                        btn.className = `w-9 h-9 rounded-xl border-2 border-slate-800 transition transform relative flex items-center justify-center pop-btn ${isMyColor ? 'ring-4 ring-slate-800 scale-110' : isTaken ? 'opacity-20 cursor-not-allowed' : 'hover:scale-105'}`;
                        btn.style.backgroundColor = hex;

                        if (isMyColor) btn.innerHTML = '<i class="fa-solid fa-check text-white text-xs drop-shadow"></i>';
                        colorPaletteEl.appendChild(btn);
                    });
                }

            } else {
                showView('viewGame');

                const currentTurnPlayerId = roomData.playerOrder[roomData.currentTurnIndex];
                const currentTurnPlayer = roomData.players[currentTurnPlayerId];
                const isMyTurn = currentTurnPlayerId === myId;

                const turnBadge = document.getElementById('turnBadge');
                if (turnBadge) {
                    turnBadge.innerHTML = isMyTurn 
                        ? `<i class="fa-solid fa-star text-amber-500 animate-bounce"></i> <span class="text-amber-500 font-black">あなたの番です！</span>`
                        : `<i class="fa-solid fa-clock text-slate-500"></i> <span>手番: ${currentTurnPlayer ? escapeHtml(currentTurnPlayer.name) : '--'}</span>`;
                }

                const instText = document.getElementById('gameInstructionText');
                if (instText) {
                    if (roomData.status === 'FINISHED') {
                        instText.innerText = "勝負あり！";
                    } else if (isMyTurn) {
                        const myPlayer = roomData.players[myId];
                        if (myPlayer.remainingTiles > 0) {
                            instText.innerText = `枠をタップして配置 (残り ${myPlayer.remainingTiles}枚)`;
                        } else if (roomData.selectedTile) {
                            instText.innerText = "移動先の枠を選んでね";
                        } else {
                            instText.innerText = "動かしたい自分のタイルを選んでね";
                        }
                    } else {
                        instText.innerText = `${currentTurnPlayer ? escapeHtml(currentTurnPlayer.name) : ''} の手番中...`;
                    }
                }

                renderBoard(isMyTurn, currentTurnPlayerId);

                const resultCtrl = document.getElementById('gameResultControls');
                const winnerText = document.getElementById('winnerText');
                const nextRoundBtn = document.getElementById('nextRoundBtn');
                const clientWaitMsg = document.getElementById('clientWaitRestartMsg');

                if (roomData.status === 'FINISHED') {
                    resultCtrl.classList.remove('hidden');
                    const winner = roomData.players[roomData.winnerId];
                    winnerText.innerText = `🎉 ${winner ? escapeHtml(winner.name) : ''} のかち！`;

                    if (typeof confetti === 'function') {
                        confetti({ particleCount: 120, spread: 90, origin: { y: 0.6 } });
                    }

                    if (isHostUser) {
                        nextRoundBtn.classList.remove('hidden');
                        clientWaitMsg.classList.add('hidden');
                    } else {
                        nextRoundBtn.classList.add('hidden');
                        clientWaitMsg.classList.remove('hidden');
                    }
                } else {
                    resultCtrl.classList.add('hidden');
                }
            }
        }

        function renderBoard(isMyTurn, currentTurnPlayerId) {
            const boardGrid = document.getElementById('boardGrid');
            if (!boardGrid) return;
            boardGrid.innerHTML = '';

            const keys = Object.keys(roomData.board);
            let minX = 0, maxX = 0, minY = 0, maxY = 0;

            if (keys.length > 0) {
                keys.forEach(k => {
                    const [x, y] = k.split(',').map(Number);
                    if (x < minX) minX = x;
                    if (x > maxX) maxX = x;
                    if (y < minY) minY = y;
                    if (y > maxY) maxY = y;
                });
                minX -= 1; maxX += 1;
                minY -= 1; maxY += 1;
            } else {
                minX = -2; maxX = 2;
                minY = -2; maxY = 2;
            }

            const cols = maxX - minX + 1;
            boardGrid.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;

            // 手持ち0枚のときは selectedTile が存在する場合のみ有効位置を計算
            const myPlayer = roomData.players[myId];
            let validSpots = [];
            if (isMyTurn) {
                if (myPlayer.remainingTiles > 0) {
                    validSpots = getValidPlacementSpots(roomData.board, null);
                } else if (roomData.selectedTile) {
                    validSpots = getValidPlacementSpots(roomData.board, roomData.selectedTile);
                }
            }

            for (let y = minY; y <= maxY; y++) {
                for (let x = minX; x <= maxX; x++) {
                    const cellKey = `${x},${y}`;
                    const tileData = roomData.board[cellKey];
                    const isValidPlace = validSpots.includes(cellKey);
                    const isSelected = roomData.selectedTile === cellKey;

                    const cell = document.createElement('div');
                    cell.className = "board-cell flex items-center justify-center relative";

                    if (tileData) {
                        const tile = document.createElement('div');
                        tile.className = `board-tile ${isSelected ? 'selected' : ''}`;
                        tile.style.backgroundColor = tileData.color;
                        tile.onclick = () => handleCellClick(x, y);

                        if (isMyTurn && myPlayer.remainingTiles <= 0 && tileData.ownerId === myId) {
                            tile.classList.add('hover:rotate-3');
                        }

                        cell.appendChild(tile);
                    } else if (isValidPlace) {
                        cell.className += " valid-place animate-pulse";
                        cell.onclick = () => handleCellClick(x, y);
                    } else {
                        cell.className += " opacity-20 border-2 border-dashed border-slate-400 rounded-xl";
                    }

                    boardGrid.appendChild(cell);
                }
            }
        }

        window.toggleSound = function() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('soundIcon');
            if (icon) {
                if (soundEnabled) icon.className = "fa-solid fa-volume-high";
                else icon.className = "fa-solid fa-volume-xmark text-rose-500";
            }
        };

        window.copyRoomCode = function() {
            if (!roomCode) return;
            navigator.clipboard.writeText(roomCode);
            showNotice("📋", "コピーしました", `あいことば [ ${roomCode} ]`);
        };

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        document.addEventListener('DOMContentLoaded', () => {
            const btnCreate = document.getElementById('btnCreateRoom');
            const btnJoin = document.getElementById('btnJoinRoom');

            if (btnCreate) btnCreate.addEventListener('click', handleCreateRoom);
            if (btnJoin) btnJoin.addEventListener('click', handleJoinRoom);
        });
    </script>
</body>
